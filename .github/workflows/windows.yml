name: Windows

# Builds, tests and (on a tag) releases the Windows port in VisualiserWindows/.
#
# The point is that every Windows build anybody downloads from us was built
# here, from a commit in this repository, by GitHub's runner. Nothing built on
# somebody's own machine is ever attached to one of our releases.
#
# Triggers:
#   - a pull request or a push to main that touches the port, or the Mac app.
#     The Mac app is included on purpose: the port's shaders/ are generated
#     from the Mac's Swift sources, and a test fails when the two disagree, so
#     a shader change on the Mac should find out here, not at the next release.
#   - a tag windows-vX.Y.Z (X.Y.Z must match VisualiserWindows/VERSION),
#     which also publishes the release.
#   - by hand, from the Actions tab (build and test only; nothing published).

on:
  push:
    branches: [main]
    tags: ["windows-v*"]
    paths:
      - "VisualiserWindows/**"
      - "VisualiserMac/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "VisualiserWindows/**"
      - "VisualiserMac/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # The release asset's name. It must never be Vibresia.zip: the Mac app's
  # updater and installer fetch Vibresia.zip from the latest release.
  ASSET: Vibresia-Windows-x64.zip

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The workflow lands before the port does. Until VisualiserWindows/ is
      # in the tree, say so and stop, rather than fail on a missing folder.
      - name: Port present
        id: present
        run: |
          if [ -f VisualiserWindows/Vibresia.slnx ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VisualiserWindows/ is not in this commit yet; nothing to build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.present.outputs.present == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        if: steps.present.outputs.present == 'true'
        run: |
          version="$(tr -d '[:space:]' < VisualiserWindows/VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/windows-v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/windows-v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::Tag says $tag_version but VisualiserWindows/VERSION says $version."
              exit 1
            fi
          fi

      # GitHub's runners have no GPU, so the GL tests are left out here, as
      # the port's README does for a machine without a display. Everything
      # else runs, including the check that shaders/ matches the Mac sources.
      - name: Tests
        if: steps.present.outputs.present == 'true'
        working-directory: VisualiserWindows
        run: dotnet test --filter "Category!=GL" -c Release

      - name: Publish
        if: steps.present.outputs.present == 'true'
        working-directory: VisualiserWindows
        run: >
          dotnet publish src/Vibresia.App -c Release -f net10.0-windows -r win-x64
          --self-contained -p:PublishSingleFile=true -o ../dist/Vibresia

      # The README says the exe ships with glfw3.dll and cimgui.dll. If
      # either goes missing the app will not start, so check before zipping.
      - name: Package
        if: steps.present.outputs.present == 'true'
        run: |
          for f in Vibresia.exe glfw3.dll cimgui.dll; do
            [ -f "dist/Vibresia/$f" ] || { echo "::error::dist/Vibresia/$f is missing"; exit 1; }
          done
          cp LICENSE dist/Vibresia/LICENSE.txt
          cp VisualiserWindows/README.md dist/Vibresia/README.md
          (cd dist && 7z a -tzip "$ASSET" ./Vibresia/* > /dev/null)
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          cat "dist/$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        if: steps.present.outputs.present == 'true'
        with:
          name: vibresia-windows-${{ steps.version.outputs.version }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.sha256
          retention-days: 30

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/windows-v') && needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vibresia-windows-${{ needs.build.outputs.version }}
          path: dist

      # A pre-release, and never "latest". The Mac app finds its updates
      # through releases/latest; a Windows release there would leave every
      # Mac install unable to update.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$ASSET" "dist/$ASSET.sha256" \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Vibresia for Windows $VERSION (beta)" \
            --prerelease \
            --latest=false \
            --notes "Community-built Windows port, built from this commit by GitHub Actions. Beta and unsigned: Windows SmartScreen will warn, choose More info, then Run anyway. Unzip everything into one folder and run Vibresia.exe."
